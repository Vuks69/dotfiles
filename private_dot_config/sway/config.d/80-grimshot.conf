# Screenshots:
# Super+P: Current window
# Super+Shift+p: Select area
# Super+Alt+p Current output
# Super+Ctrl+p Select a window
set $screencap $mod+p
bindsym $screencap              exec grimshot savecopy active
bindsym $screencap+Shift        exec wayfreeze --after-freeze-cmd='grimshot savecopy area; pkill wayfreeze'
bindsym $screencap+Mod1         exec grimshot savecopy output
bindsym $screencap+Ctrl         exec wayfreeze --after-freeze-cmd='grimshot savecopy window; pkill wayfreeze'
# bindsym $screencap+Ctrl         exec grimshot savecopy window
bindsym $screencap+Ctrl+Mod1    exec grimshot savecopy screen
